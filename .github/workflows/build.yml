name: Build Cinejoy TV APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create project files
        run: |
          mkdir -p CinejoyTV/app
          cat > CinejoyTV/app/build.gradle <<'CINEJOY_EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.cinejoy.tv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cinejoy.tv'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          CINEJOY_EOF
          mkdir -p CinejoyTV/app/src/main
          cat > CinejoyTV/app/src/main/AndroidManifest.xml <<'CINEJOY_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:banner="@drawable/tv_banner"
                  android:hardwareAccelerated="true"
                  android:label="Cinejoy TV"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          CINEJOY_EOF
          mkdir -p CinejoyTV/app/src/main/java/com/cinejoy/tv
          cat > CinejoyTV/app/src/main/java/com/cinejoy/tv/MainActivity.java <<'CINEJOY_EOF'
          package com.cinejoy.tv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String HOME_URL = "https://cinejoy.pk/";

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);

                  webView = new WebView(this);
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.setBackgroundColor(0xFF000000);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportMultipleWindows(false);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          // Keep browsing inside this TV app; the website may use its own subdomains.
                          return false;
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectTvFocusStyle();
                      }
                  });
                  setContentView(new FrameLayout(this) {{ addView(webView, new FrameLayout.LayoutParams(-1, -1)); }});
                  webView.loadUrl(HOME_URL);
                  webView.requestFocus();
              }

              private void injectTvFocusStyle() {
                  String js = "(function(){if(document.getElementById('cinejoy-tv-focus'))return;" +
                    "var s=document.createElement('style');s.id='cinejoy-tv-focus';" +
                    "s.textContent=':focus{outline:3px solid #ffd54f!important;outline-offset:3px!important;}'+" +
                    "'button:focus,a:focus,[role=button]:focus,input:focus,video:focus{box-shadow:0 0 0 3px #ffd54f!important;}';" +
                    "document.head.appendChild(s);})();";
                  webView.evaluateJavascript(js, null);
              }

              @Override public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getAction() == KeyEvent.ACTION_DOWN) {
                      int key = event.getKeyCode();
                      if (key == KeyEvent.KEYCODE_BACK) {
                          if (webView != null && webView.canGoBack()) webView.goBack();
                          else finish();
                          return true;
                      }
                      if (key == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE || key == KeyEvent.KEYCODE_MEDIA_PLAY || key == KeyEvent.KEYCODE_MEDIA_PAUSE) {
                          webView.evaluateJavascript("(function(){var v=document.querySelector('video');if(v){if(v.paused)v.play();else v.pause();}})()", null);
                          return true;
                      }
                      // Let WebView and the website receive D-pad, OK/Enter and other remote keys.
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override protected void onDestroy() {
                  if (webView != null) { webView.stopLoading(); webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          CINEJOY_EOF
          mkdir -p CinejoyTV/app/src/main/res/drawable
          cat > CinejoyTV/app/src/main/res/drawable/tv_banner.xml <<'CINEJOY_EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#101820" />
              <corners android:radius="8dp" />
          </shape>
          CINEJOY_EOF
          mkdir -p CinejoyTV/app/src/main/res/values
          cat > CinejoyTV/app/src/main/res/values/styles.xml <<'CINEJOY_EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFD54F</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          CINEJOY_EOF
          cat > CinejoyTV/build.gradle <<'CINEJOY_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          CINEJOY_EOF
          cat > CinejoyTV/gradle.properties <<'CINEJOY_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          CINEJOY_EOF
          cat > CinejoyTV/settings.gradle <<'CINEJOY_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'CinejoyTV'
          include ':app'
          CINEJOY_EOF
      - name: Build APK
        working-directory: CinejoyTV
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CinejoyTV-apk
          path: CinejoyTV/app/build/outputs/apk/debug/app-debug.apk
